services:
  mysql:
    image: mysql:8.4
    container_name: acee-booth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portrait_booth}
      MYSQL_USER: ${MYSQL_USER:-portrait_booth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portrait-booth-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-portrait-booth-root-local}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: